# 빌드 성능 (refactor backlog #13ⓐ). 이 세 줄이 하는 일과, 두 줄을 일부러 안 켠 이유.
#
# jvmargs/kotlin.daemon.jvmargs를 올린 이유: 모듈 셋(shared/engine-android/app-android) +
# 아키텍처 계약 테스트(소스 트리 전체를 문자열로 훑는다, app-android/build.gradle.kts 참고)를
# 기존 -Xmx2048m 하나로 Gradle 데몬과 Kotlin 컴파일 데몬이 나눠 쓰면 GC 압박이 커진다.
# org.gradle.parallel=true는 서로 의존하지 않는 모듈(:shared/:engine-android)의 태스크를
# 동시에 돌린다 — 세 모듈 다 순차 의존은 :app-android→:shared,:engine-android뿐이라 효과가 있다.
#
# 🔴 **org.gradle.caching과 org.gradle.configuration-cache는 켜지 마라.**
# `app-android/build.gradle.kts`가 **구성 시점에** `Properties().apply { ... load(it) }`로
# `local.properties`(gitignored, 기계마다 다른 값 — AdMob 키, release 키스토어 경로, 콘센트
# 디버그 플래그 등)를 읽는다(35번째 줄 `localProperties`, 87번째 줄 `versionProperties`도 같은
# 패턴으로 `version.properties`를 읽는다). configuration-cache는 "구성 단계를 캐싱해 다음
# 빌드부터 건너뛴다"는 게 핵심이라, 이 read가 캐시에 얼어붙으면 기계를 바꾸거나
# local.properties/version.properties 값만 바꿔 다시 빌드해도 옛 값을 그대로 쓰게 된다 —
# Gradle이 이 파일 read를 구성 캐시의 입력으로 자동 추적해주지 않기 때문이다(공식적으로
# 지원하려면 `providers.fileContents`로 다시 짜야 하는데, 이 저장소는 아직 그렇게 안 되어
# 있다). org.gradle.caching(태스크 출력 캐싱)은 그 자체로는 이 문제와 무관하지만, 이
# 저장소는 로컬 빌드만 쓰고(위 architectureContractScannedSources 주석 참고) 원격/공유 캐시가
# 없어 얻을 이득이 크지 않은 반면, 잘못 재사용된 캐시 히트를 의심할 새 원인만 하나 늘린다 —
# 켜려면 구성 캐시 문제를 먼저 풀고 나서 별도로 판단할 것.
org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx4g
org.gradle.parallel=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official


# ⚠️ **R8의 "최적화된 리소스 축소" — 켠 채로 둘 것**(백로그 #119, 2026-09-06).
# Play Console이 811 업로드에서 *"최적화된 리소스 축소가 사용 설정되지 않음"* 을 권장조치로
# 띄웠다. 콘솔이 읽는 값은 번들 안의 `BUNDLE-METADATA/com.android.tools/r8.json`이고, 그 파일의
# `resourceOptimization.isOptimizedShrinkingEnabled`가 정확히 이 플래그다(811에서는 `false`였다).
# ⚠️ **AGP 9.0부터는 기본값이라 이 줄이 필요 없어진다** — 그때 지울 것(#120).
android.r8.optimizedResourceShrinking=true
