org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official


# ⚠️ **R8의 "최적화된 리소스 축소" — 켠 채로 둘 것**(백로그 #119, 2026-09-06).
# Play Console이 811 업로드에서 *"최적화된 리소스 축소가 사용 설정되지 않음"* 을 권장조치로
# 띄웠다. 콘솔이 읽는 값은 번들 안의 `BUNDLE-METADATA/com.android.tools/r8.json`이고, 그 파일의
# `resourceOptimization.isOptimizedShrinkingEnabled`가 정확히 이 플래그다(811에서는 `false`였다).
# ⚠️ **AGP 9.0부터는 기본값이라 이 줄이 필요 없어진다** — 그때 지울 것(#120).
android.r8.optimizedResourceShrinking=true
