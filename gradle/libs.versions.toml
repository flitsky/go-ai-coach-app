[versions]
agp = "8.13.2"
kotlin = "2.3.20"
# Compose BOM — 2025.11.01 = Material3 1.4.0(안정판) · Compose UI 1.9.5(백로그 #281, 사용자 2026-10-23). 1.8 → 1.9 줄에 멈춘 것은
# 더 새 BOM(Compose 1.10~1.12)이 한 번에 넘는 판이 커서다. Expressive API(모양 · 떠 있는 툴바 등)는 1.4.0에 없다 — 1.5.0 정식 때 다시 본다.
composeBom = "2025.11.01"
activityCompose = "1.10.1"
junit = "4.13.2"
androidxJunit = "1.3.0"
espresso = "3.7.0"
firebaseBom = "34.17.0"
googleServices = "4.5.0"
credentials = "1.6.0"
googleid = "1.2.0"
playServicesAds = "25.4.0"
playBilling = "9.1.0"
playAppUpdate = "2.1.0"
# 두 모델을 PAD 에셋 팩으로 받는다(백로그 #245) — 팩의 위치·받기 요청·진행 상태를 묻는 Play Core 라이브러리.
playAssetDelivery = "2.3.0"
lifecycleProcess = "2.8.7"
kotlinxCoroutines = "1.8.0"
# 엔진 JSON 분석(백로그 #293) — 안드로이드 · iOS가 함께 쓰는 엔진 코드가 org.json(안드로이드 전용) 대신 쓴다. 런타임 라이브러리만 쓴다(직렬화 플러그인 없음).
# 1.10.0 = kotlin-stdlib 2.3.0 전제(앱은 Kotlin 2.3.20). 1.11.0부터는 더 새 Kotlin을 전제할 수 있다 — 올릴 때 POM의 stdlib 판을 본다.
kotlinxSerialization = "1.10.0"
camerax = "1.4.1"
# 바둑판 사진 EXIF 회전(백로그 #210) — CameraX가 이미 끌어오는 판과 같은 1.3.2로 명시한다(해석 결과 불변).
exifinterface = "1.3.2"
# 바둑판 사진 인식(백로그 #263) — ⚠️ 4.11 미만의 .so는 16KB 정렬이 아니다(함정 33).
opencv = "4.14.0"
guava = "33.3.1-android"
spotless = "8.4.0"
# spotless 플러그인이 받아 쓰는 ktlint 엔진 버전(Gradle 의존이 아니라 spotless가 자체 configuration으로 해석한다).
# 1.8.0 = spotless 8.4.0(spotless-lib 4.5.0)의 기본값. 내장 파서는 kotlin-compiler-embeddable 2.2.21이지만
# Kotlin 2.3.20 코드 624파일을 파싱 오류 0으로 읽었다(2026-09-25). 올릴 때는 spotlessCheck의 lint 0을 확인한다.
ktlint = "1.8.0"
# 오픈소스 라이선스 화면(백로그 #195). ⚠️ **13.2.1에 멈춘다** — 14.x부터 `-core`가 Java 21 바이트코드(클래스 65)라
# JDK 17에서 도는 JVM 단위 테스트가 `UnsupportedClassVersionError`로 터진다(2026-09-30 실측). 13.2.1은 Java 17(61)·
# kotlin-stdlib 2.3.0이라 Kotlin 2.3.20과 맞는다. 15.x는 Kotlin 2.4·AGP 9 전제. JDK를 21로 올리는 날 함께 올릴 것.
# 앱은 `-core`(JSON 파서)만 쓰고 화면은 직접 그린다 — `-compose-m3`는 Compose를 BOM(1.8)보다 위로 끌어올린다.
aboutLibraries = "13.2.1"
# iOS 화면(백로그 #292 · U-83 Compose Multiplatform) — `:shared-ui` 모듈만 쓴다. ⚠️ 앱의 Compose BOM과 **같은 줄**이어야 한다:
# CMP 1.9.3 = androidx Compose UI 1.9.4 · CMP Material3 1.9.0 = androidx material3 1.4.0(앱 BOM 2025.11.01 = UI 1.9.5 · material3 1.4.0, 2026-10-26 Maven 모듈 메타데이터로 확인).
# BOM을 올리면 이 두 줄도 그 줄에 맞는 판으로 함께 올린다 — 한쪽만 올리면 #294에서 안드로이드 화면이 다른 판으로 끌려간다.
composeMultiplatform = "1.9.3"
composeMultiplatformMaterial3 = "1.9.0"
# Compose Multiplatform이 이미 끌어오는 판(안드로이드에서는 androidx.lifecycle 2.9.4로 풀린다) — 공용 코드가 생명주기를 직접 쓰려고 적는다(백로그 #294).
jetbrainsLifecycle = "2.9.6"

[libraries]
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
# Material3 1.4.0부터 `material-icons-core`를 끌어오지 않는다 — 앱이 쓰는 `Icons.Filled.*`(코어 세트)는 이 선언으로 받는다. 판은 BOM이 정한다.
androidx-compose-material-icons-core = { module = "androidx.compose.material:material-icons-core" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
androidx-compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
androidx-compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }
androidx-junit = { module = "androidx.test.ext:junit", version.ref = "androidxJunit" }
junit = { module = "junit:junit", version.ref = "junit" }
firebase-bom = { module = "com.google.firebase:firebase-bom", version.ref = "firebaseBom" }
firebase-auth = { module = "com.google.firebase:firebase-auth" }
firebase-analytics = { module = "com.google.firebase:firebase-analytics" }
androidx-credentials = { module = "androidx.credentials:credentials", version.ref = "credentials" }
androidx-credentials-play-services-auth = { module = "androidx.credentials:credentials-play-services-auth", version.ref = "credentials" }
google-id = { module = "com.google.android.libraries.identity.googleid:googleid", version.ref = "googleid" }
play-services-ads = { module = "com.google.android.gms:play-services-ads", version.ref = "playServicesAds" }
play-billing = { module = "com.android.billingclient:billing", version.ref = "playBilling" }
play-app-update = { module = "com.google.android.play:app-update", version.ref = "playAppUpdate" }
play-asset-delivery = { module = "com.google.android.play:asset-delivery", version.ref = "playAssetDelivery" }
androidx-lifecycle-process = { module = "androidx.lifecycle:lifecycle-process", version.ref = "lifecycleProcess" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
androidx-camera-core = { module = "androidx.camera:camera-core", version.ref = "camerax" }
androidx-exifinterface = { module = "androidx.exifinterface:exifinterface", version.ref = "exifinterface" }
opencv = { module = "org.opencv:opencv", version.ref = "opencv" }
androidx-camera-camera2 = { module = "androidx.camera:camera-camera2", version.ref = "camerax" }
androidx-camera-lifecycle = { module = "androidx.camera:camera-lifecycle", version.ref = "camerax" }
androidx-camera-view = { module = "androidx.camera:camera-view", version.ref = "camerax" }
guava = { module = "com.google.guava:guava", version.ref = "guava" }
aboutlibraries-core = { module = "com.mikepenz:aboutlibraries-core", version.ref = "aboutLibraries" }
compose-mp-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "composeMultiplatform" }
compose-mp-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "composeMultiplatform" }
compose-mp-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "composeMultiplatform" }
compose-mp-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "composeMultiplatformMaterial3" }
compose-mp-ui-backhandler = { module = "org.jetbrains.compose.ui:ui-backhandler", version.ref = "composeMultiplatform" }
# 아이콘 그리기 도구(materialIcon · materialPath) — JetBrains는 1.7.3을 마지막으로 낸다. 안드로이드에서는 이미 있는 androidx 1.7.8로 풀린다.
compose-mp-material-icons-core = { module = "org.jetbrains.compose.material:material-icons-core", version = "1.7.3" }
jetbrains-lifecycle-runtime-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "jetbrainsLifecycle" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
android-asset-pack = { id = "com.android.asset-pack", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
google-services = { id = "com.google.gms.google-services", version.ref = "googleServices" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
aboutlibraries-android = { id = "com.mikepenz.aboutlibraries.plugin.android", version.ref = "aboutLibraries" }
# 같은 플러그인의 기본판 — KMP 타깃마다 목록을 낸다. iOS 앱의 목록(`:ios-licenses`, 백로그 #294)만 쓴다.
aboutlibraries = { id = "com.mikepenz.aboutlibraries.plugin", version.ref = "aboutLibraries" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
